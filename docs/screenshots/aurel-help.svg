<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc">
  <title id="title">Aurel help command in a terminal</title>
  <desc id="desc">A terminal screenshot showing the aurel help output and main CLI options.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <style>
      .window-title { fill: #cbd5e1; font: 14px Consolas, "Courier New", monospace; }
      .prompt { fill: #38bdf8; font: 20px Consolas, "Courier New", monospace; }
      .command { fill: #f8fafc; }
      .heading { fill: #facc15; font: 20px Consolas, "Courier New", monospace; }
      .text { fill: #cbd5e1; font: 19px Consolas, "Courier New", monospace; }
      .option { fill: #86efac; font: 19px Consolas, "Courier New", monospace; }
    </style>
  </defs>
  <rect width="1120" height="740" fill="#f6f8fb"/>
  <rect x="40" y="32" width="1040" height="668" rx="8" fill="#0f172a" filter="url(#shadow)"/>
  <path d="M48 32h1024a8 8 0 0 1 8 8v34H40V40a8 8 0 0 1 8-8z" fill="#111827"/>
  <circle cx="70" cy="53" r="7" fill="#f87171"/>
  <circle cx="94" cy="53" r="7" fill="#fbbf24"/>
  <circle cx="118" cy="53" r="7" fill="#34d399"/>
  <text x="560" y="59" text-anchor="middle" class="window-title">PowerShell - aurel --help</text>

  <text x="72" y="116" class="prompt">PS C:\projects\aurel&gt; <tspan class="command">aurel --help</tspan></text>
  <text x="72" y="166" class="heading" xml:space="preserve">usage: aurel [-h] [--version] [--detailed] [-o OUTPUT]</text>
  <text x="72" y="196" class="heading" xml:space="preserve">             [--format {terminal,text,markdown,json,html}] [--compare COMPARE]</text>
  <text x="72" y="226" class="heading" xml:space="preserve">             [--min-score MIN_SCORE] [--config CONFIG]</text>
  <text x="72" y="256" class="heading" xml:space="preserve">             [--github-token GITHUB_TOKEN]</text>
  <text x="72" y="286" class="heading" xml:space="preserve">             [repository_url]</text>
  <text x="72" y="344" class="text" xml:space="preserve">Analyze whether a remote repository is ready for contributors.</text>
  <text x="72" y="402" class="option" xml:space="preserve">positional arguments:</text>
  <text x="96" y="432" class="text" xml:space="preserve">repository_url     GitHub, GitLab, or Bitbucket repository URL</text>
  <text x="72" y="490" class="option" xml:space="preserve">options:</text>
  <text x="96" y="520" class="text" xml:space="preserve">--version          Show the installed Aurel version</text>
  <text x="96" y="550" class="text" xml:space="preserve">--detailed         Show the full terminal report instead of the summary</text>
  <text x="96" y="580" class="text" xml:space="preserve">-o, --output       Write a report to a local path</text>
  <text x="96" y="610" class="text" xml:space="preserve">--format           terminal, text, markdown, json, or html</text>
  <text x="96" y="640" class="text" xml:space="preserve">--min-score        Exit non-zero below a readiness threshold</text>
  <text x="96" y="670" class="text" xml:space="preserve">--config           Load project-specific aurel.yml rules</text>
</svg>
